<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<script>
  /* 首帧语言引导（防 FOUC）：站点源码是简体中文，译文在运行时才覆盖；不干预的话首帧会先渲染中文
     再被替换（首页首屏、点击导航切页时都会「闪一下中文」）。这里在解析 <head> 时就把语言定下来
     并隐藏正文，等 i18n.js 完成覆盖后再显示（i18n.js 会在 apply() 内移除 data-tp-pending）。 */
  (function () {
    var d = document.documentElement;
    /* 优先级：?lang= 显式指定 > 手动切换过的偏好 > 浏览器语言 > 英文兜底 */
    function normalize(tag) {
      var t = String(tag || '').toLowerCase();
      if (!t) return '';
      if (t === 'zh' || t === 'zh-hans' || t === 'zh-cn' || t === 'zh-sg') return 'zh-CN';
      if (t === 'zh-tw' || t === 'zh-hk' || t === 'zh-mo' || t === 'zh-hant') return 'zh-TW';
      if (/^(en|ja|es|pt|fr|de)$/.test(t.split('-')[0])) return t.split('-')[0];
      return '';
    }
    function detectLang() {
      var q = '';
      try { q = new URLSearchParams(window.location.search).get('lang') || ''; } catch (e) { q = ''; }
      var byQuery = normalize(q);
      if (byQuery) return byQuery;
      try {
        if (window.localStorage.getItem('tokpure.lang.manual') === '1') {
          var saved = window.localStorage.getItem('tokpure.lang') || '';
          if (normalize(saved)) return normalize(saved);
        }
      } catch (e) { /* 隐私模式：直接走浏览器语言 */ }
      var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
      for (var i = 0; i < list.length; i++) {
        var hit = normalize(list[i]);
        if (hit) return hit;
      }
      return 'en';
    }
    var lang = detectLang();
    d.setAttribute('lang', lang);
    d.setAttribute('data-lang', lang);
    if (lang === 'zh-CN') return; /* 简体中文即源码本身，无需遮罩 */
    d.setAttribute('data-tp-pending', '1');
    var st = document.createElement('style');
    st.textContent = 'html[data-tp-pending] body{visibility:hidden!important}';
    (document.head || d).appendChild(st);
    /* 兜底：词典请求失败或脚本异常时也要让页面显示出来，避免长时间空白 */
    setTimeout(function () { d.removeAttribute('data-tp-pending'); }, 1500);
  })();
</script>
