<script>
  (function initTokPureAuth() {
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const registerNameGroup = document.getElementById('registerNameGroup');
    const submitText = document.getElementById('submitText');
    const viewHeading = document.getElementById('viewHeading');
    const forgotPwdLink = document.getElementById('forgotPwdLink');

    // Tab switcher
    tabLogin.addEventListener('click', () => {
      tabLogin.className = 'py-2 text-center rounded-lg font-headline-sm text-headline-sm transition-all duration-200 bg-surface-container text-on-surface shadow-sm font-medium';
      tabRegister.className = 'py-2 text-center rounded-lg font-headline-sm text-headline-sm transition-all duration-200 text-outline hover:text-on-surface';
      registerNameGroup.classList.add('hidden');
      forgotPwdLink.classList.remove('hidden');
      submitText.textContent = '登录并同步设备授权';
      viewHeading.textContent = '欢迎登录 TokPure 创作者中心';
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.className = 'py-2 text-center rounded-lg font-headline-sm text-headline-sm transition-all duration-200 bg-surface-container text-on-surface shadow-sm font-medium';
      tabLogin.className = 'py-2 text-center rounded-lg font-headline-sm text-headline-sm transition-all duration-200 text-outline hover:text-on-surface';
      registerNameGroup.classList.remove('hidden');
      forgotPwdLink.classList.add('hidden');
      submitText.textContent = '立即注册并获取 7 天完整许可';
      viewHeading.textContent = '开启 TokPure 原生纯净体验';
    });

    // Password visibility toggle
    const pwdInput = document.getElementById('pwdInput');
    const togglePwd = document.getElementById('togglePwd');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePwd.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });

    // License key accordion toggle
    const toggleLicense = document.getElementById('toggleLicense');
    const licenseDrawer = document.getElementById('licenseDrawer');
    const licenseChevron = document.getElementById('licenseChevron');

    toggleLicense.addEventListener('click', () => {
      const isHidden = licenseDrawer.classList.contains('hidden');
      if (isHidden) {
        licenseDrawer.classList.remove('hidden');
        licenseDrawer.classList.add('flex');
        licenseChevron.style.transform = 'rotate(180deg)';
      } else {
        licenseDrawer.classList.add('hidden');
        licenseDrawer.classList.remove('flex');
        licenseChevron.style.transform = 'rotate(0deg)';
      }
    });
  })();
